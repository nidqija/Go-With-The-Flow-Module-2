<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - Gopher Watch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100">

    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card bg-secondary text-white border-info shadow-lg">
                    <div class="card-header bg-black text-info text-center py-3 border-bottom border-secondary">
                        <h3 class="mb-0 fw-bold">🚀 GOPHER-WATCH</h3>
                        <small class="text-muted">Workshop Sign In Demo</small>
                    </div>
                    <div class="card-body p-4">
                        
                        {{if .IsSubmitted}}
                            {{if not .Success}}
                                <div class="alert alert-danger text-center shadow-sm mb-4" role="alert">
                                    <strong>❌ Error:</strong> {{.Error}}
                                </div>
                            {{end}}
                        {{end}}

                        <form action="/signin" method="POST">
                            <div class="mb-3">
                                <label for="username" class="form-label text-light">Username</label>
                                <input type="text" class="form-control bg-dark text-light border-secondary" id="username" name="username" placeholder="e.g. admin" required>
                            </div>
                            <div class="mb-3">
                                <label for="password" class="form-label text-light">Password</label>
                                <input type="password" class="form-control bg-dark text-light border-secondary" id="password" name="password" placeholder="e.g. gopher123" required>
                            </div>
                            <button type="submit" class="btn btn-info w-100 fw-bold py-2 mt-2">Sign In</button>
                        </form>

                       
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
